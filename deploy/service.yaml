# Cloud Run multi-container service, rendered by deploy.sh (shell-style placeholders, python string.Template).
#
#   app      ingress container: LINE webhook, Cloud Tasks target, DSH research agents
#   litellm  sidecar on localhost:4000: Anthropic Messages → Gemini on Vertex AI
#
# Same scaling model as the Go/ADK service: scale to zero, stateless instances,
# state in Firestore / GCS.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE}
  labels:
    cloud.googleapis.com/location: ${REGION}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/container-dependencies: '{"app":["litellm"]}'
    spec:
      serviceAccountName: ${SA_EMAIL}
      containerConcurrency: 10
      timeoutSeconds: 3600
      containers:
        - name: app
          image: ${APP_IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          env:
            - { name: GCP_PROJECT_ID, value: "${PROJECT_ID}" }
            - { name: GCP_LOCATION, value: "${GCP_LOCATION}" }
            - { name: GEMINI_MODEL, value: "${GEMINI_MODEL}" }
            - { name: GCS_BUCKET, value: "${GCS_BUCKET}" }
            - { name: FIRESTORE_COLLECTION_PREFIX, value: "${COLLECTION_PREFIX}" }
            - { name: CLOUD_TASKS_QUEUE, value: "${TASKS_QUEUE}" }
            - { name: CLOUD_TASKS_LOCATION, value: "${REGION}" }
            - { name: CLOUD_RUN_SERVICE_URL, value: "${SERVICE_URL}" }
            - { name: SERVICE_ACCOUNT_EMAIL, value: "${SA_EMAIL}" }
            - { name: LITELLM_BASE_URL, value: "http://127.0.0.1:4000" }
            - name: LINE_CHANNEL_SECRET
              valueFrom: { secretKeyRef: { name: LINE_CHANNEL_SECRET, key: latest } }
            - name: LINE_CHANNEL_ACCESS_TOKEN
              valueFrom: { secretKeyRef: { name: LINE_CHANNEL_ACCESS_TOKEN, key: latest } }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: LITELLM_MASTER_KEY, key: latest } }
          resources:
            limits: { cpu: "2", memory: 4Gi }
          startupProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 2
            failureThreshold: 30
        - name: litellm
          image: ${LITELLM_IMAGE}
          env:
            - { name: GCP_PROJECT_ID, value: "${PROJECT_ID}" }
            - { name: GCP_LOCATION, value: "${GCP_LOCATION}" }
            - { name: GEMINI_MODEL, value: "${GEMINI_MODEL}" }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: LITELLM_MASTER_KEY, key: latest } }
          resources:
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet: { path: /health/liveliness, port: 4000 }
            periodSeconds: 3
            failureThreshold: 40
